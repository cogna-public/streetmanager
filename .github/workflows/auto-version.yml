# Release everything merged to main since the last v* tag
# - Bumps the patch version (0.5.11 → 0.5.12), or minor or major when a PR title
#   since the last release contains [minor] or [major]
# - Runs as the cogna-package-releaser app, the only actor allowed to push to main
#   without review and to create v* tags
# - The release it creates triggers publish.yml
# - Safe to re-run: it finishes an interrupted release, and does nothing when
#   everything is already released

name: Auto Version Bump

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: auto-version
  cancel-in-progress: false

jobs:
  bump-version:
    name: Auto-bump version and create release
    runs-on: ubuntu-latest
    # The app's own bump push triggers this workflow; skip it to avoid a loop
    if: github.actor != 'cogna-package-releaser[bot]'
    # Holds the app key; only main can deploy to it
    environment: release
    steps:
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Look up the app's bot user
        id: bot-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          BOT_USER_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          echo "id=${BOT_USER_ID}" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The tip, not the triggering commit, so a queued run includes earlier bumps
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: false

      - name: Configure git
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BOT_USER_ID: ${{ steps.bot-user.outputs.id }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Finish an interrupted release
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          # A bump commit for the current version that never got its tag or release
          BUMP_COMMIT=$(git log --first-parent --format='%H %s' | awk -v s="publish: bump to v${VERSION}" '!found && $0 == $1 " " s { print $1; found = 1 }')
          if [ -z "$BUMP_COMMIT" ]; then
            echo "No bump commit for v${VERSION}; nothing to finish."
            exit 0
          fi
          if ! git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            git tag "v${VERSION}" "$BUMP_COMMIT"
            git push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "v${VERSION}"
          fi
          if ! gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" --title "v${VERSION}" --generate-notes --verify-tag
          fi

      - name: Choose the bump
        id: bump
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            RANGE="${LAST_TAG}..HEAD"
          else
            # No release from this repo yet: consider only the newest merge
            RANGE="HEAD~1..HEAD"
          fi
          # Squash-only repo, so each first-parent subject is a PR title
          SUBJECTS=$(git log --first-parent --format=%s "$RANGE" | grep -v '^publish: bump to v' || true)
          if [ -z "$SUBJECTS" ]; then
            echo "Nothing merged since ${LAST_TAG}; nothing to release."
            echo "part=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$SUBJECTS" in
            *"[major]"*) PART="major" ;;
            *"[minor]"*) PART="minor" ;;
            *) PART="patch" ;;
          esac
          echo "Releasing a ${PART} bump for:"
          echo "$SUBJECTS"
          echo "part=${PART}" >> "$GITHUB_OUTPUT"
          echo "last-tag=${LAST_TAG}" >> "$GITHUB_OUTPUT"

      - name: Bump, tag and release
        if: steps.bump.outputs.part != ''
        env:
          PART: ${{ steps.bump.outputs.part }}
          LAST_TAG: ${{ steps.bump.outputs.last-tag }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          # The app token, unlike GITHUB_TOKEN, lets the release trigger publish.yml
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          uv version --bump "$PART"
          NEW_VERSION=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          git add pyproject.toml uv.lock
          git commit -m "publish: bump to v${NEW_VERSION}"

          # Pass the token per push so it is never stored in .git/config. If main
          # moved during the run, this push is rejected; the run for the newer merge
          # releases both, or re-run this one.
          REMOTE="https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$REMOTE" HEAD:main
          git tag "v${NEW_VERSION}"
          git push "$REMOTE" "v${NEW_VERSION}"

          if [ -n "$LAST_TAG" ]; then
            RELEASE_NOTES=$(git log --first-parent --format="- %s" "${LAST_TAG}..HEAD" | grep -v '^- publish: bump to v' || true)
          else
            RELEASE_NOTES="First release from cogna-public/${GITHUB_REPOSITORY#*/}. Earlier versions are in CHANGELOG.md."
          fi
          gh release create "v${NEW_VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v${NEW_VERSION}" \
            --notes "$RELEASE_NOTES" \
            --verify-tag
